<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Service - Eve Marie Blake</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#163422",
              primaryLight: "#2d4b37",
              gold: "#775a19",
              goldLight: "#c9aa68",
              textMain: "#1c1b1b",
              textSoft: "#5e625f",
              borderSoft: "#c2c8c0",
            },

            fontFamily: {
              serif: ["Libre Caslon Text", "serif"],
              sans: ["Manrope", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;

        background: radial-gradient(
          circle at center,
          #ffffff 0%,
          #ffffff 60%,
          #fefdfc 100%
        );

        overflow-x: hidden;
      }

      /* --------------------------------------------------
           Navigation
        -------------------------------------------------- */

      .top-nav {
        position: sticky;
        top: 0;

        width: 100%;

        z-index: 50;

        background: rgba(255, 255, 255, 0.94);

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);

        border-bottom: 1px solid rgba(119, 90, 25, 0.15);
      }

      .top-nav-inner {
        max-width: 680px;

        margin: 0 auto;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 36px;

        padding: 18px 20px;
      }

      .nav-link {
        font-family: "Libre Caslon Text", serif;

        font-size: 17px;

        color: #5e625f;

        text-decoration: none;

        padding-bottom: 4px;

        transition:
          color 150ms ease,
          border-color 150ms ease;
      }

      .nav-link:hover {
        color: #163422;
      }

      .nav-link.active {
        color: #163422;

        border-bottom: 2px solid #775a19;
      }

      /* --------------------------------------------------
           Decorative vines
        -------------------------------------------------- */

      .vine {
        position: fixed;

        pointer-events: none;
        user-select: none;

        object-fit: contain;

        z-index: 0;
      }

      .vine-left {
        width: clamp(280px, 24vw, 420px);

        left: 0;
        bottom: 0;
      }

      .vine-right {
        width: clamp(260px, 22vw, 390px);

        right: 0;
        top: 64px;
      }

      /* --------------------------------------------------
           Main content
        -------------------------------------------------- */

      .content {
        position: relative;

        z-index: 10;

        width: 100%;
        max-width: 760px;

        margin: 0 auto;

        padding: 42px 20px 70px;
      }

      /* --------------------------------------------------
           Intro / date
        -------------------------------------------------- */

      .service-date {
        text-align: center;

        margin-bottom: 32px;
      }

      .service-date-label {
        font-family: "Manrope", sans-serif;

        font-size: 11px;
        font-weight: 700;

        letter-spacing: 0.14em;

        color: #775a19;

        text-transform: uppercase;

        margin-bottom: 8px;
      }

      .service-date-value {
        font-family: "Libre Caslon Text", serif;

        font-size: 22px;

        color: #163422;
      }

      /* --------------------------------------------------
           Portrait
        -------------------------------------------------- */

      .portrait-frame {
        width: 100%;
        max-width: 390px;

        margin: 0 auto 38px;

        padding: 8px;

        border: 1px solid #c9aa68;

        background: white;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      }

      .portrait-frame img {
        display: block;

        width: 100%;
        height: auto;
      }

      /* --------------------------------------------------
           Heading
        -------------------------------------------------- */

      .memorial-heading {
        text-align: center;
      }

      .memorial-heading .intro {
        font-family: "Libre Caslon Text", serif;

        font-style: italic;

        font-size: 20px;

        color: #5e625f;

        margin: 0 0 10px;
      }

      .memorial-heading h1 {
        font-family: "Libre Caslon Text", serif;

        font-weight: 400;

        font-size: 48px;
        line-height: 1.15;

        color: #163422;

        margin: 0 0 22px;
      }

      /* --------------------------------------------------
           Divider
        -------------------------------------------------- */

      .divider {
        display: flex;
        align-items: center;
        justify-content: center;

        gap: 12px;

        margin: 0 auto 36px;
      }

      .divider-line {
        width: 56px;
        height: 1px;

        background: #c9aa68;
      }

      .divider-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #775a19;
      }

      /* --------------------------------------------------
           Details
        -------------------------------------------------- */

      .details {
        width: 100%;
        max-width: 560px;

        margin: 0 auto;

        background: rgba(255, 255, 255, 0.92);
      }

      .detail-section {
        padding: 30px 24px;

        text-align: center;

        border-top: 1px solid rgba(201, 170, 104, 0.48);
      }

      .detail-section:last-child {
        border-bottom: 1px solid rgba(201, 170, 104, 0.48);
      }

      .detail-title {
        font-family: "Manrope", sans-serif;

        font-size: 12px;
        font-weight: 700;

        letter-spacing: 0.14em;

        color: #775a19;

        margin: 0 0 12px;
      }

      .detail-text {
        font-family: "Manrope", sans-serif;

        font-size: 16px;
        line-height: 1.75;

        color: #5e625f;

        margin: 0;
      }

      .map-link {
        display: inline-block;

        margin-top: 14px;

        font-family: "Manrope", sans-serif;

        font-size: 12px;
        font-weight: 700;

        letter-spacing: 0.12em;

        text-transform: uppercase;

        color: #775a19;

        text-decoration: none;

        transition: color 150ms ease;
      }

      .map-link:hover {
        color: #163422;
      }

      /* --------------------------------------------------
           RSVP
        -------------------------------------------------- */

      .rsvp-wrapper {
        display: flex;
        justify-content: center;

        margin-top: 40px;
      }

      .rsvp-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-width: 220px;

        padding: 16px 36px;

        background: #163422;

        color: white;

        font-family: "Manrope", sans-serif;

        font-size: 13px;
        font-weight: 700;

        letter-spacing: 0.12em;

        text-decoration: none;

        transition: background-color 150ms ease;
      }

      .rsvp-button:hover {
        background: #2d4b37;
      }

      /* --------------------------------------------------
           Mobile
        -------------------------------------------------- */

      @media (max-width: 650px) {
        .top-nav-inner {
          gap: 24px;

          padding: 15px 16px;
        }

        .nav-link {
          font-size: 15px;
        }

        .vine-left {
          width: 220px;

          left: -55px;
          bottom: -25px;

          opacity: 0.9;
        }

        .vine-right {
          width: 210px;

          right: -50px;
          top: 52px;

          opacity: 0.9;
        }

        .content {
          padding-top: 32px;
          padding-bottom: 60px;
        }

        .service-date {
          /*
                 * White backing ensures the date remains
                 * readable even if foliage reaches behind it.
                 */
          position: relative;

          z-index: 20;

          width: fit-content;

          margin: 0 auto 28px;

          padding: 8px 18px;

          background: rgba(255, 255, 255, 0.92);
        }

        .service-date-value {
          font-size: 18px;
        }

        .portrait-frame {
          max-width: 300px;

          margin-bottom: 32px;
        }

        .memorial-heading .intro {
          font-size: 18px;
        }

        .memorial-heading h1 {
          font-size: 36px;

          margin-bottom: 20px;
        }

        .detail-section {
          padding: 26px 18px;
        }

        .rsvp-button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body class="font-sans text-textMain">
    <!-- --------------------------------------------------
         Navigation
    --------------------------------------------------- -->

    <header class="top-nav">
      <nav class="top-nav-inner">
        <a href="/" class="nav-link"> Obituary </a>

        <a href="/service.html" class="nav-link active"> Service </a>

        <a href="/rsvp.html" class="nav-link"> RSVP </a>
      </nav>
    </header>

    <!-- --------------------------------------------------
         Decorative vines
    --------------------------------------------------- -->

    <img src="/VineLeft.png" alt="" class="vine vine-left" />

    <img src="/VineRight.png" alt="" class="vine vine-right" />

    <!-- --------------------------------------------------
         Main content
    --------------------------------------------------- -->

    <main class="content">
      <!-- Date first -->

      <!-- Portrait -->

      <div class="portrait-frame">
        <img src="/ehb.png" alt="Eve Marie Blake" />
      </div>
      <section class="service-date">
        <div class="service-date-label">Service</div>

        <div class="service-date-value">
          Thursday, 27th August 2026 at 4:00pm
        </div>
      </section>

      <!-- Heading -->

      <section class="memorial-heading">
        <p class="intro">Celebrating the life of</p>

        <h1>Eve Marie Blake</h1>
      </section>

      <!-- Divider -->

      <div class="divider">
        <div class="divider-line"></div>

        <div class="divider-dot"></div>

        <div class="divider-line"></div>
      </div>

      <!-- Service / reception details -->

      <section class="details">
        <div class="detail-section">
          <h2 class="detail-title">SERVICE TO BE HELD AT</h2>

          <p class="detail-text">
            Yeovil Crematorium<br />
            Bunford Lane<br />
            Yeovil BA20 2EJ
          </p>

          <a
            class="map-link"
            href="https://www.google.com/maps/search/?api=1&query=Yeovil+Crematorium+Bunford+Lane+Yeovil+BA20+2EJ"
            target="_blank"
            rel="noopener noreferrer"
          >
            View Map
          </a>
        </div>

        <div class="detail-section">
          <h2 class="detail-title">FOLLOWED BY RECEPTION AT</h2>

          <p class="detail-text">
            The Sherborne House<br />
            Newland<br />
            Sherborne DT9 3JG
          </p>

          <a
            class="map-link"
            href="https://www.google.com/maps/search/?api=1&query=The+Sherborne+House+Newland+Sherborne+DT9+3JG"
            target="_blank"
            rel="noopener noreferrer"
          >
            View Map
          </a>
        </div>
      </section>

      <!-- RSVP -->

      <div class="rsvp-wrapper">
        <a href="/rsvp.html" class="rsvp-button"> RSVP TO ATTEND </a>
      </div>
    </main>
  </body>
</html>
